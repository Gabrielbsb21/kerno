name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.8"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Select Rust toolchain
        run: rustup show

      - name: Build the editable package
        run: uv sync --locked --reinstall-package kerno

      - name: Check Rust and Python quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run cargo fmt --check
          uv run cargo clippy --all-targets -- -D warnings
          uv run cargo test
          uv run ruff check .
          uv run ruff format --check .

      - name: Run package integration tests
        run: uv run pytest

      - name: Build source distribution and wheel
        run: uv build --no-sources

      - name: Test the installed wheel outside the checkout
        run: uv run python scripts/check_wheel.py
